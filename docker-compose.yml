version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: store_pro_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: telegram_store_pro
    volumes:
      - mongo_data:/data/db
    networks:
      - store_net

  redis:
    image: redis:7-alpine
    container_name: store_pro_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - store_net

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: store_pro_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/telegram_store_pro
      - JWT_SECRET=super_secret_jwt_key_telegram_store_2026_production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - BAKONG_IS_SANDBOX=${BAKONG_IS_SANDBOX:-true}
    depends_on:
      - mongodb
      - redis
    networks:
      - store_net

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: store_pro_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - store_net

  telegram-bot:
    build:
      context: .
      dockerfile: apps/telegram-bot/Dockerfile
    container_name: store_pro_bot
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - BACKEND_API_URL=http://backend:5000/api
      - TELEGRAM_MINI_APP_URL=${TELEGRAM_MINI_APP_URL:-http://localhost:3000/store}
    depends_on:
      - backend
    networks:
      - store_net

volumes:
  mongo_data:
  redis_data:

networks:
  store_net:
    driver: bridge
